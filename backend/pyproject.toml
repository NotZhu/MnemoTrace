[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mnemotrace-next"
version = "0.1.0"
description = "MnemoTrace backend scaffold"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "COMMERCIAL-LICENSE.md"]
dependencies = []

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
