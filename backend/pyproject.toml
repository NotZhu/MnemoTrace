[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mnemotrace-next"
version = "0.1.0"
description = "MnemoTrace backend scaffold"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "COMMERCIAL-LICENSE.md"]
dependencies = ["psycopg[binary]==3.3.8", "psycopg-pool==3.3.3"]

[project.optional-dependencies]
inference = ["httpx>=0.28,<1", "jsonschema>=4.26,<5", "tzdata"]
server = ["mnemotrace-next[inference]", "fastapi>=0.128,<1", "pydantic>=2.11,<3", "uvicorn>=0.41,<1"]

[dependency-groups]
dev = ["mnemotrace-next[server]", "mypy", "pytest", "ruff", "types-jsonschema>=4.26,<5"]

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = ["postgres: 使用独立 PostgreSQL 实例的集成测试"]
