[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemotrace-memory"
version = "0.1.0"
description = "MnemoTrace — an open-source, reproducible long-term memory engine for LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "COMMERCIAL-LICENSE.md"]
authors = [{ name = "MnemoTrace contributors" }]
keywords = ["memory", "llm", "agents", "rag", "knowledge-graph", "long-term-memory", "bi-temporal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core has zero hard dependencies; extraction requires an injected LLM, tests use fixed responses.
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.8", "psycopg-pool==3.3.3"]
# Real embedding/LLM/vector/graph backends slot in behind the same interfaces.
embeddings = ["sentence-transformers>=2.2"]  # local BGE embeddings (MNEMOTRACE_EMBEDDER=bge-*; no API key)
fastembed = ["fastembed==0.9.1", "huggingface-hub>=0.20,<2"]
llm = ["litellm>=1.40"]
# Serving / adoption layer; see docs/architecture/README.md.
server = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2"]   # the multi-tenant HTTP API + console
# mcp is pinned <2: the server is written against the 1.x FastMCP API, and mcp 2.0.0 removed
# mcp.server.fastmcp (fresh CI resolves broke the moment 2.0 shipped). Lift after porting to 2.x.
mcp = ["mcp>=1.2,<2", "httpx>=0.27"]                           # the MCP server (httpx for remote-proxy mode)
# One-shot install for running the hosted product: HTTP API + MCP + real embeddings + an LLM backend.
serve = ["mnemotrace-memory[server,mcp,fastembed,llm,postgres]"]
eval = ["numpy>=1.24"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "ruff>=0.4", "tomli>=2; python_version < '3.11'"]
all = ["mnemotrace-memory[server,mcp,embeddings,fastembed,llm,eval,dev,postgres]"]

[project.scripts]
mnemotrace = "mnemotrace.cli:main"
mnemotrace-quickstart = "mnemotrace.quickstart:main"       # configured-LLM example
mnemotrace-mcp = "mnemotrace.mcp.__main__:main"            # run the MCP server
mnemotrace-agent-setup = "mnemotrace.agent_setup:main"     # print cross-agent memory config snippets
mnemotrace-agent-bootstrap = "mnemotrace.agent_setup:bootstrap_main" # install + verify common agent configs
mnemotrace-agent-doctor = "mnemotrace.agent_doctor:main"   # verify an agent's Python/MCP memory runtime

[project.urls]
Homepage = "https://github.com/NotZhu/MnemoTrace"
Repository = "https://github.com/NotZhu/MnemoTrace"
Documentation = "https://github.com/NotZhu/MnemoTrace#readme"
Issues = "https://github.com/NotZhu/MnemoTrace/issues"

[tool.hatch.build.targets.wheel]
packages = ["mnemotrace"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep the CI gate focused on syntax and Pyflakes correctness; formatter and
# modernization rules would require a separate repository-wide migration.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
cache_dir = ".artifacts/pytest/cache"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
