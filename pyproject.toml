[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mnemotrace"
version = "0.1.0"
description = "Long-term memory for LLM agents"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["psycopg[binary]==3.3.8", "psycopg-pool==3.3.3"]

[project.optional-dependencies]
inference = ["httpx>=0.28,<1", "jsonschema>=4.26,<5", "tzdata"]
server = ["mnemotrace[inference]", "fastapi>=0.128,<1", "pydantic>=2.11,<3", "uvicorn>=0.41,<1"]

[dependency-groups]
eval = ["filelock>=3.16,<4", "httpx>=0.28,<1", "pydantic>=2.11,<3", "tiktoken>=0.9,<1"]
dev = ["mnemotrace[server]", "mypy", "pytest", "ruff", "types-jsonschema>=4.26,<5", {include-group = "eval"}]

[tool.hatch.build.targets.wheel]
packages = ["mnemotrace"]

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["mnemotrace", "tests", "scripts", "eval"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = ["postgres: 使用独立 PostgreSQL 实例的集成测试"]
