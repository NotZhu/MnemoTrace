name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - run: npm --prefix clients/typescript ci
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v9.0.1
        with:
          version: '0.12.14'
          enable-cache: false
      - name: Check SDK OpenAPI types
        run: |
          uv run --locked python scripts/export_openapi.py "$RUNNER_TEMP/mnemotrace-openapi.json"
          npm --prefix clients/typescript run generate:openapi -- --check "$RUNNER_TEMP/mnemotrace-openapi.json"
      - run: npm --prefix clients/typescript run typecheck
      - run: npm --prefix clients/typescript test
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
