name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,server,mcp]" build twine
      - run: python -m ruff check .
      - name: Python regressions (including native namespace transactions)
        run: pytest
        timeout-minutes: 20
      - run: python scripts/check_repository.py
      - run: python scripts/build_landing_pages.py --check
      - run: python scripts/check_zero_setup.py
      - run: python scripts/check_release.py
      - if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel, = Path("dist").glob("*.whl")
          with ZipFile(wheel) as archive:
              assert "mnemotrace/py.typed" in archive.namelist()
          PY

  optional-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,server,mcp,lancedb,documents]"
      - run: python -m pytest tests/test_lancedb_store.py tests/test_documents.py
        timeout-minutes: 10

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - run: npm --prefix clients/typescript ci
      - run: npm --prefix clients/typescript run typecheck
      - run: npm --prefix clients/typescript test
      - run: npm --prefix clients/typescript run build
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag mnemotrace-memory:ci .
