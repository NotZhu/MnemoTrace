name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: ${{ matrix.suite == 'replay' && format('python replay ({0}, {1})', matrix.os, matrix.python-version) || format('python ({0}, {1})', matrix.os, matrix.python-version) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.15"]
        suite: [regressions, replay]
        exclude:
          - os: ubuntu-latest
            suite: replay
    steps:
      # test_buffered_replay_report resolves a historical runtime commit; a shallow
      # clone cannot see it, so fetch full history for the Python regression job.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,server,mcp]" build twine
      - if: matrix.suite == 'regressions'
        run: python -m ruff check .
      - name: Python regressions (including native namespace transactions)
        run: >-
          pytest
          ${{ matrix.suite == 'replay' && 'tests/test_buffered_replay_runner.py'
              || (runner.os == 'Windows' && '--ignore=tests/test_buffered_replay_runner.py' || '') }}
        timeout-minutes: 20
        env:
          PYTEST_ADDOPTS: >-
            ${{ runner.os == 'Windows' && '--durations=20 --durations-min=1 --junitxml=.artifacts/ci/python-regressions.xml' || '' }}
      - name: Upload Windows Python regression report
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: python-windows-${{ matrix.python-version }}-${{ matrix.suite }}
          path: .artifacts/ci/python-regressions.xml
      - if: matrix.suite == 'regressions'
        run: python scripts/check_repository.py
      - if: matrix.suite == 'regressions'
        run: python scripts/build_landing_pages.py --check
      - if: matrix.suite == 'regressions'
        run: python scripts/check_core.py
      - if: matrix.suite == 'regressions'
        run: python scripts/check_release.py
      - if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel, = Path("dist").glob("*.whl")
          with ZipFile(wheel) as archive:
              assert "mnemotrace/py.typed" in archive.namelist()
              from mnemotrace.store.postgres.migrate import MIGRATIONS
              for script in MIGRATIONS:
                  assert f"mnemotrace/store/postgres/sql/{script}" in archive.namelist()
          PY

  optional-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,server,mcp,lancedb,qdrant,documents]"
      - run: python -m pytest tests/test_lancedb_store.py tests/test_qdrant_store.py tests/test_storage_configuration.py tests/test_documents.py
        timeout-minutes: 10

  qdrant-remote:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    env:
      MNEMOTRACE_TEST_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,server,mcp,qdrant]"
      - name: Wait for real Qdrant
        run: |
          python - <<'PY'
          import time
          import urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:6333/readyz", timeout=2).close()
                  break
              except OSError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
      - run: python -m pytest tests/test_qdrant_store.py tests/test_storage_configuration.py
        timeout-minutes: 10

  postgres-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.15"]
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
        env:
          POSTGRES_PASSWORD: phase2-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MNEMOTRACE_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,postgres,server,mcp]"
      - run: python -m pytest tests/postgres tests/test_postgres_configuration.py --junitxml=.artifacts/storage-phase2/postgres.xml
        env:
          MNEMOTRACE_TEST_POSTGRES_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports['5432'] }} dbname=postgres user=postgres password=phase2-ci-only connect_timeout=5
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-linux-${{ matrix.python-version }}
          path: .artifacts/storage-phase2/*.xml

  postgres-windows:
    # Hosted jobs cannot share a Linux service's private network. A native PG18
    # server exercises the same extension/schema using actual Windows clients.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.15"]
    env:
      MNEMOTRACE_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Download dedicated Postgres 18 binaries
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'postgres18.zip'
          $install = Join-Path $env:RUNNER_TEMP 'mnemotrace-postgres18'
          Invoke-WebRequest 'https://get.enterprisedb.com/postgresql/postgresql-18.6-1-windows-x64-binaries.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $install
          "PGROOT=$install\pgsql" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/checkout@v4
        with:
          repository: pgvector/pgvector
          ref: v0.8.7
          path: .artifacts/storage-phase2/pgvector
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build pgvector 0.8.7
        shell: pwsh
        working-directory: .artifacts/storage-phase2/pgvector
        run: |
          nmake /F Makefile.win
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          nmake /F Makefile.win install
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Start disposable native database
        shell: pwsh
        run: |
          $dbData = Join-Path $env:RUNNER_TEMP 'mnemotrace-phase2-data'
          $passwordFile = Join-Path $env:RUNNER_TEMP 'mnemotrace-phase2-password'
          [System.IO.File]::WriteAllText($passwordFile, 'phase2-ci-only')
          & "$env:PGROOT\bin\initdb.exe" -D $dbData -U postgres -A scram-sha-256 --pwfile=$passwordFile --encoding=UTF8 --locale=C
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:PGROOT\bin\pg_ctl.exe" -D $dbData -l "$dbData\server.log" -o '-h 127.0.0.1 -p 55432' -w start
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "MNEMOTRACE_TEST_POSTGRES_DSN=host=127.0.0.1 port=55432 dbname=postgres user=postgres password=phase2-ci-only connect_timeout=5" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: python -m pip install -e ".[dev,postgres,server,mcp]"
      - run: python -m pytest tests/postgres tests/test_postgres_configuration.py --junitxml=.artifacts/storage-phase2/postgres.xml
        timeout-minutes: 10
      - name: Stop disposable native database
        if: always()
        shell: pwsh
        run: |
          $dbData = Join-Path $env:RUNNER_TEMP 'mnemotrace-phase2-data'
          if (Test-Path -LiteralPath "$dbData\postmaster.pid") {
            & "$env:PGROOT\bin\pg_ctl.exe" -D $dbData -m fast -w stop
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-windows-${{ matrix.python-version }}
          path: .artifacts/storage-phase2/*.xml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - run: npm --prefix clients/typescript ci
      - run: npm --prefix clients/typescript run typecheck
      - run: npm --prefix clients/typescript test
      - run: npm --prefix clients/typescript run build
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag mnemotrace-memory:ci .
