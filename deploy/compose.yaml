name: mnemotrace

x-postgres-dsn: &postgres-dsn postgresql://mnemotrace_app:${MNEMOTRACE_DB_PASSWORD:?set the application database password}@db:5432/mnemotrace

x-app: &app
  image: ${MNEMOTRACE_IMAGE:-mnemotrace:local}
  pull_policy: never
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-runtime: &runtime
  <<: *app
  restart: unless-stopped
  depends_on: &database_ready
    migrate:
      condition: service_completed_successfully
  env_file:
    - path: .env.models
      required: false
      format: raw
  environment: &runtime-environment
    MNEMOTRACE_POSTGRES_DSN: *postgres-dsn
    MNEMOTRACE_DB_LOCK_TIMEOUT_SECONDS: ${MNEMOTRACE_DB_LOCK_TIMEOUT_SECONDS:-1}
    MNEMOTRACE_DB_STATEMENT_TIMEOUT_SECONDS: ${MNEMOTRACE_DB_STATEMENT_TIMEOUT_SECONDS:-15}
    MNEMOTRACE_DB_MAINTENANCE_TIMEOUT_SECONDS: ${MNEMOTRACE_DB_MAINTENANCE_TIMEOUT_SECONDS:-60}
    MNEMOTRACE_EXTRACTION_TIMEZONE: ${MNEMOTRACE_EXTRACTION_TIMEZONE-UTC}

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
    restart: unless-stopped
    entrypoint: [bash, /usr/local/bin/mnemotrace-postgres-entrypoint.sh]
    command: [postgres]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mnemotrace
      POSTGRES_INITDB_ARGS: --auth-local=peer --auth-host=scram-sha-256
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      MNEMOTRACE_DB_PASSWORD: ${MNEMOTRACE_DB_PASSWORD:?set the application database password}
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres-entrypoint.sh:/usr/local/bin/mnemotrace-postgres-entrypoint.sh:ro
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/01-mnemotrace.sql:ro
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, mnemotrace_app, -d, mnemotrace]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *runtime
    environment:
      <<: *runtime-environment
      MNEMOTRACE_MAX_BODY_BYTES: ${MNEMOTRACE_MAX_BODY_BYTES:-65536}
      MNEMOTRACE_QUEUE_LIMIT: ${MNEMOTRACE_QUEUE_LIMIT:-100}
    stop_grace_period: ${MNEMOTRACE_API_STOP_GRACE_PERIOD:-45s}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - 127.0.0.1:${MNEMOTRACE_HTTP_PORT:-8100}:8100
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8100/readyz', timeout=4).close()"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    <<: *runtime
    command:
      - python
      - -m
      - mnemotrace.worker
      - --concurrency
      - "${MNEMOTRACE_WORKER_CONCURRENCY:-2}"
      - --profile-concurrency
      - "${MNEMOTRACE_WORKER_PROFILE_CONCURRENCY:-1}"
      - --summary-concurrency
      - "${MNEMOTRACE_WORKER_SUMMARY_CONCURRENCY:-1}"
      - --readiness-port
      - "8101"
    healthcheck:
      test: [CMD, python, -c, "from socket import create_connection; create_connection(('127.0.0.1', 8101), timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
    environment:
      MNEMOTRACE_POSTGRES_DSN: *postgres-dsn
    entrypoint: [python, -m, mnemotrace.adapters.postgres.migrate]
    command: [up]

  admin:
    <<: *app
    profiles: [ops]
    depends_on: *database_ready
    environment:
      MNEMOTRACE_POSTGRES_DSN: *postgres-dsn
    entrypoint: [python, -m, mnemotrace.admin]
    command: [--help]

volumes:
  postgres:
