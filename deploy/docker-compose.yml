name: mnemotrace

services:
  mnemotrace:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mnemotrace-memory:0.1.0
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MNEMOTRACE_PORT:-8000}:8000"
    environment:
      MNEMOTRACE_API_KEYS: "${MNEMOTRACE_API_KEYS:?set MNEMOTRACE_API_KEYS in deploy/.env}"
      MNEMOTRACE_DATA_DIR: /data
      MNEMOTRACE_EMBEDDER: "${MNEMOTRACE_EMBEDDER:-hashing}"
      MNEMOTRACE_LLM: "${MNEMOTRACE_LLM:-}"
      MNEMOTRACE_ANSWERER: "${MNEMOTRACE_ANSWERER:-}"
      MNEMOTRACE_MAX_REQUEST_BYTES: "${MNEMOTRACE_MAX_REQUEST_BYTES:-2097152}"
      MNEMOTRACE_MAX_HOT_USERS: "${MNEMOTRACE_MAX_HOT_USERS:-64}"
      MNEMOTRACE_MAX_HOT_FACTS: "${MNEMOTRACE_MAX_HOT_FACTS:-10000}"
    volumes:
      - mnemotrace_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3); assert r.status == 200 and json.load(r)['ready']"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

volumes:
  mnemotrace_data:
