name: mnemotrace-next

x-app: &app
  image: ${MNEMOTRACE_NEXT_IMAGE:-mnemotrace-next:local}
  pull_policy: never
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    db:
      condition: service_healthy

x-runtime: &runtime
  <<: *app
  restart: unless-stopped
  env_file:
    - path: .env.models
      required: false
      format: raw
  environment: &runtime-environment
    MNEMOTRACE_NEXT_POSTGRES_DSN: postgresql://mnemotrace_next_runtime:${MNEMOTRACE_NEXT_RUNTIME_PASSWORD:?set the runtime password}@db:5432/mnemotrace_next

services:
  db:
    image: &postgres pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
    restart: unless-stopped
    environment:
      POSTGRES_DB: mnemotrace_next
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set the PostgreSQL bootstrap password}
      MNEMOTRACE_NEXT_MIGRATION_PASSWORD: ${MNEMOTRACE_NEXT_MIGRATION_PASSWORD:?set the migration password}
      MNEMOTRACE_NEXT_RUNTIME_PASSWORD: ${MNEMOTRACE_NEXT_RUNTIME_PASSWORD:?set the runtime password}
      MNEMOTRACE_NEXT_ADMIN_PASSWORD: ${MNEMOTRACE_NEXT_ADMIN_PASSWORD:?set the admin password}
    volumes:
      - postgres:/var/lib/postgresql
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, mnemotrace_next]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *runtime
    environment:
      <<: *runtime-environment
      MNEMOTRACE_NEXT_MAX_BODY_BYTES: ${MNEMOTRACE_NEXT_MAX_BODY_BYTES:-65536}
      MNEMOTRACE_NEXT_QUEUE_LIMIT: ${MNEMOTRACE_NEXT_QUEUE_LIMIT:-100}
    stop_grace_period: ${MNEMOTRACE_NEXT_API_STOP_GRACE_PERIOD:-45s}
    build:
      context: ../../backend
      dockerfile: ../deploy/next/Dockerfile
    ports:
      - 127.0.0.1:${MNEMOTRACE_NEXT_HTTP_PORT:-8100}:8100
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8100/readyz', timeout=4).close()"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    <<: *runtime
    command: [python, -m, mnemotrace_next.worker, --concurrency, "${MNEMOTRACE_NEXT_WORKER_CONCURRENCY:-2}", --readiness-port, "8101"]
    healthcheck:
      test: [CMD, python, -c, "from socket import create_connection; create_connection(('127.0.0.1', 8101), timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    <<: *app
    profiles: [ops]
    environment:
      MNEMOTRACE_NEXT_MIGRATION_DSN: postgresql://mnemotrace_next_migrate:${MNEMOTRACE_NEXT_MIGRATION_PASSWORD:?set the migration password}@db:5432/mnemotrace_next
    entrypoint: [python, -m, mnemotrace_next.adapters.postgres.migrate]
    command: [up]

  grant:
    image: *postgres
    profiles: [ops]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: mnemotrace_next
      PGUSER: mnemotrace_next_migrate
      PGPASSWORD: ${MNEMOTRACE_NEXT_MIGRATION_PASSWORD:?set the migration password}
    volumes:
      - ./grant-roles.sql:/grant-roles.sql:ro
    entrypoint: [psql, -X, -v, ON_ERROR_STOP=1, -v, runtime_role=mnemotrace_next_runtime, -v, admin_role=mnemotrace_next_admin, -f, /grant-roles.sql]

  admin:
    <<: *app
    profiles: [ops]
    environment:
      MNEMOTRACE_NEXT_ADMIN_DSN: postgresql://mnemotrace_next_admin:${MNEMOTRACE_NEXT_ADMIN_PASSWORD:?set the admin password}@db:5432/mnemotrace_next
    entrypoint: [python, -m, mnemotrace_next.admin]
    command: [--help]

volumes:
  postgres:
