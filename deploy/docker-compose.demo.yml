# 演示实例使用独立的 Postgres 数据库和签发的 Bearer key。
#
#   docker compose -f deploy/docker-compose.demo.yml up -d --build
name: mnemotrace-demo

services:
  model-init:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mnemotrace-memory:demo
    command: [python, -m, mnemotrace.embed.fastembed_embed]
    environment:
      MNEMOTRACE_EMBEDDER: "${MNEMOTRACE_EMBEDDER:-fastembed}"
    volumes:
      - model-cache:/var/cache/mnemotrace/fastembed
    healthcheck:
      disable: true

  mnemotrace:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mnemotrace-memory:demo
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MNEMOTRACE_PORT:-8456}:8000"
    environment:
      MNEMOTRACE_DATABASE_URL: "${MNEMOTRACE_DEMO_DATABASE_URL:?set the demo Postgres runtime connection}"
      MNEMOTRACE_DB_ROLE_PREFIX: "${MNEMOTRACE_DB_ROLE_PREFIX:-mnemotrace}"
      MNEMOTRACE_EMBEDDER: "${MNEMOTRACE_EMBEDDER:-fastembed}"
      MNEMOTRACE_EMBED_OFFLINE: "1"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      MNEMOTRACE_LLM: "${MNEMOTRACE_LLM:-}"
      MNEMOTRACE_ANSWERER: "${MNEMOTRACE_ANSWERER:-}"
      MNEMOTRACE_MAX_REQUEST_BYTES: "${MNEMOTRACE_MAX_REQUEST_BYTES:-2097152}"
    read_only: true
    depends_on:
      model-init:
        condition: service_completed_successfully
    volumes:
      - model-cache:/var/cache/mnemotrace/fastembed:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3); assert r.status == 200 and json.load(r)['ready']"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

volumes:
  model-cache:
